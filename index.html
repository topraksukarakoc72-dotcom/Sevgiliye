<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Bir Sorum Var 💕</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Arial', sans-serif;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        h1 {
            color: #d63384;
            font-size: 2rem;
            margin-bottom: 30px;
            padding: 0 20px;
        }
        .buttons {
            display: flex;
            gap: 20px;
            position: relative;
            height: 50px;
            align-items: center;
        }
        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #evet {
            background-color: #ff4757;
            color: white;
        }
        #hayir {
            background-color: #ffffff;
            color: #555;
            position: absolute;
            left: 100px;
        }
    </style>
</head>
<body>

    <h1>Benimle bir ömür biter mi? 🥺❤️</h1>

    <div class="buttons">
        <button id="evet" onclick="evetTiklandi()">Evet! 🥰</button>
        <button id="hayir" onmouseover="kac()" onclick="kac()">Hayır 🙄</button>
    </div>

    <script>
        function kac() {
            const hayirBtn = document.getElementById('hayir');
            const x = Math.random() * (window.innerWidth - hayirBtn.offsetWidth - 50);
            const y = Math.random() * (window.innerHeight - hayirBtn.offsetHeight - 50);
            hayirBtn.style.position = 'fixed';
            hayirBtn.style.left = x + 'px';
            hayirBtn.style.top = y + 'px';
        }

        function evetTiklandi() {
            document.body.innerHTML = `
                <h1 style="color: #ff4757; font-size: 2.5rem;">Biliyordum! Seni çok seviyorum ❤️🥰</h1>
            `;
        }
    </script>
</body>
</html>
